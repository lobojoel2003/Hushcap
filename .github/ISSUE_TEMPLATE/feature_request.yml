name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need captions to do?
      description: Describe the situation (a clinic visit, a family dinner, a lecture…) and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Windows, Linux, Android, Command-line tool, All]
