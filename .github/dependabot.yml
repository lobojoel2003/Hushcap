version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
