name: CI

on:
  push:
    branches: [main, "claude/**", "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HUSHCAP_BUILD_NUMBER: ${{ github.run_number }}
  HUSHCAP_GIT_SHA: ${{ github.sha }}

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-version.sh

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Placeholder frontend for the Tauri crate
        shell: bash
        run: mkdir -p desktop/dist && [ -f desktop/dist/index.html ] || echo '<!doctype html><title>Hushcap</title>' > desktop/dist/index.html
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (engine without whisper)
        if: runner.os == 'Linux'
        run: cargo clippy -p hushcap-engine --no-default-features --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  e2e:
    name: End-to-end transcription
    runs-on: ubuntu-22.04
    needs: rust
    env:
      HUSHCAP_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Build CLI
        run: cargo build --release --locked -p hushcap-cli
      - name: Cache models
        uses: actions/cache@v6
        with:
          path: .models
          key: models-tiny-en-campplus-v1
      - name: Download models
        run: |
          mkdir -p "$HUSHCAP_MODELS_DIR"
          ./target/release/hushcap models download whisper-tiny.en
          ./target/release/hushcap models download speaker-campplus-voxceleb
          ./target/release/hushcap models verify speaker-campplus-voxceleb
          cat "$HUSHCAP_MODELS_DIR"/*.sha256
      - name: Transcribe a known recording
        run: |
          curl -sSfL -o jfk.wav https://github.com/ggml-org/whisper.cpp/raw/master/samples/jfk.wav
          ./target/release/hushcap transcribe jfk.wav --model whisper-tiny.en --format srt | tee out.srt
          # Phrases can be split at pauses ("Ask not!" / "what your country…"), so check pieces.
          grep -qi "fellow americans" out.srt
          grep -qi "ask not" out.srt
          grep -qi "what you can do for your country" out.srt
          ./target/release/hushcap transcribe jfk.wav --model whisper-tiny.en --format json > out.json
          python3 - <<'PY'
          import json
          captions = json.load(open("out.json"))["captions"]
          assert len(captions) >= 2, captions
          assert captions[0]["startMs"] < 2000, captions
          assert all(a["endMs"] <= b["startMs"] for a, b in zip(captions, captions[1:])), captions
          # A single speaker must get a single label.
          assert len({c["speaker"] for c in captions}) == 1, captions
          PY
      - name: Live captions from system audio (PulseAudio monitor)
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speakers sink_properties=device.description=Speakers
          pactl set-default-sink speakers
          ./target/release/hushcap devices
          # Play the recording into the virtual speakers while Hushcap captions their monitor.
          (sleep 5; paplay --device=speakers jfk.wav) &
          (sleep 25; echo) | ./target/release/hushcap live --system --model whisper-tiny.en \
            --speaker-model none --no-partials > live.txt
          cat live.txt
          grep -qi "\[system\]" live.txt
          grep -qi "your country" live.txt
      - name: Speaker model integration test
        env:
          HUSHCAP_TEST_SPEAKER_MODEL: ${{ github.workspace }}/.models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
        run: cargo test --release --locked -p hushcap-engine --test speaker_model -- --nocapture

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Format and lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint, unit tests and debug build
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hushcap-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
