[workspace]
resolver = "2"
members = [
    "crates/hushcap-core",
    "crates/hushcap-engine",
    "crates/hushcap-cli",
    "desktop/src-tauri",
]
default-members = [
    "crates/hushcap-core",
    "crates/hushcap-engine",
    "crates/hushcap-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Hushcap contributors"]
repository = "https://github.com/lobojoel2003/Hushcap"
homepage = "https://github.com/lobojoel2003/Hushcap"

[workspace.dependencies]
hushcap-core = { path = "crates/hushcap-core", version = "0.1.0" }
hushcap-engine = { path = "crates/hushcap-engine", version = "0.1.0" }
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
rustfft = "6"
hound = "3.5"
whisper-rs = { version = "0.16", features = ["log_backend"] }
tract-onnx = "0.23"
cpal = "0.18"
dirs = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "http2"] }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
panic = "unwind"

# whisper.cpp and the DSP code are hot paths; keep them fast in dev builds too.
[profile.dev.package."*"]
opt-level = 2
